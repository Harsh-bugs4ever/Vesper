# Render Blueprint for Vesper Backend
services:
  - type: web
    name: vesper-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /ready
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: VESPER_ENVIRONMENT
        value: "production"
      - key: VESPER_SERVICE_NAME
        value: "vesper-backend"
      - key: VESPER_PROPERTY_TIMEZONE
        value: "Asia/Kolkata"
      - key: VESPER_CURRENCY
        value: "INR"
      # Set this in Render to the Upstash Connect -> TCP URL (rediss://...).
      # REST credentials do not support this app's Redis Streams consumers.
      - key: VESPER_REDIS_URL
        sync: false
      - key: VESPER_REDIS_POOL_MAX_CONNECTIONS
        value: "8"
      - key: PORT
        value: "8000"
