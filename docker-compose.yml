# One backend, one Redis, one web app. Everything runs on a laptop.
#
# This was thirteen near-identical service blocks behind a gateway. They are one
# process now: the same routes on the same port, minus the proxy hop and twelve
# images. The database is unchanged — one Postgres with one schema per bounded
# context (see vesper_common.db) — so splitting a context back out stays a
# deployment change rather than a rewrite.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VESPER_DATABASE_URL: postgresql+psycopg://postgres:ansh@host.docker.internal:5432/vesper_hackathon
      VESPER_REDIS_URL: redis://redis:6379/0
      VESPER_JWT_SECRET: ${VESPER_JWT_SECRET:-dev-only-change-me}
      VESPER_ENVIRONMENT: ${VESPER_ENVIRONMENT:-development}
      VESPER_PROPERTY_TIMEZONE: ${VESPER_PROPERTY_TIMEZONE:-Asia/Kolkata}
      VESPER_CORS_ORIGINS: ${VESPER_CORS_ORIGINS:-http://localhost:3000}
      # Stamped on every event this process publishes and on every service token it
      # mints, where thirteen different names used to appear.
      VESPER_SERVICE_NAME: vesper-backend
      VESPER_GROQ_API_KEY: ${VESPER_GROQ_API_KEY:-}
      VESPER_CONCIERGE_MODEL: ${VESPER_CONCIERGE_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8000:8000"
    volumes:
      # Issue photos are written here and served straight back off it.
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # /ready, not /health: it reports on Postgres and Redis, so the web app does not
      # come up in front of a backend that cannot answer anything yet.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys,json; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/ready')).get('ready') else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Reached from the browser, so this is the host's address, not a compose hostname.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  uploads:
